# Week 8 study on Multi30k EN->DE (ADR-022). Every run, evaluation and selection rule.
# Runs are named <experiment>_s<seed> (defaults) and <experiment>-<variant>_s<seed>, so
# the Week 6/7 seed-1 runs are reused as-is. Estimated T4 cost: ~9 h (one or two
# sessions; the runner stops cleanly and the next session continues).
name: week8_multi30k
reference: transformer
models:
  transformer: configs/experiment/multi30k_tiny.yaml
  bilstm_luong: configs/experiment/multi30k_bilstm_luong.yaml
  gru_bahdanau: configs/experiment/multi30k_gru_bahdanau.yaml
  lstm_seq2seq: configs/experiment/multi30k_lstm_seq2seq.yaml
main_seeds: [1, 2, 3, 4, 5]
bootstrap_samples: 1000
default_beam: 4
default_alpha: 0.6

# Selected per model on VALID (mean BLEU over seeds 1-3), then reported on test.
decoding:
  split: valid
  seeds: [1, 2, 3]
  beams: [1, 4, 8]
  length_penalties: [0.0, 0.3, 0.6, 1.0, 1.5]

# The same grid for every model (DESIGN.md §7.3). Values equal to a model's default
# (e.g. dropout 0.1 for the Transformer, 0.3 for the RNNs) reuse its main runs.
# The variant with the lowest mean validation NLL is then run on all main seeds.
sensitivity:
  models: all
  seeds: [1, 2, 3]
  variants:
    lr_half: ["train.schedule.peak_lr=3.5e-4"]
    lr_double: ["train.schedule.peak_lr=1.4e-3"]
    dropout0.1: ["model.dropout=0.1"]
    dropout0.2: ["model.dropout=0.2"]
    dropout0.3: ["model.dropout=0.3"]
    dropout0.4: ["model.dropout=0.4"]

# Paper Table 3 style, plus this project's design decisions (ADR-003, ADR-015).
ablations:
  models: [transformer]
  seeds: [1, 2, 3]
  variants:
    heads1: ["model.num_heads=1"]                      # (A) single head, d_k = 256
    heads8: ["model.num_heads=8"]                      # (A) d_k = 32
    layers1: ["model.num_encoder_layers=1", "model.num_decoder_layers=1"]   # (C)
    layers6: ["model.num_encoder_layers=6", "model.num_decoder_layers=6"]   # (C)
    no_dropout: ["model.dropout=0.0"]                  # (D)
    no_label_smoothing: ["train.label_smoothing=0.0"]  # (D)
    learned_pe: ["model.positional_encoding=learned"]  # (E)
    pre_ln: ["model.norm_position=pre"]                # ADR-003
    untied: ["model.tie_weights=false"]                # ADR-015 §3
    no_embed_scale: ["model.scale_embedding=false"]    # paper §3.4

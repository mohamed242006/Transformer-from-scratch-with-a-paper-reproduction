# Mid-level configuration (spec §6.2): IWSLT14 DE->EN headline runs on Kaggle.
# Standard small-data Transformer shape (narrow FFN, 4 heads, high dropout).
# 36,663,296 parameters with a 10k joint vocabulary (math.md §9.4).
name: transformer_iwslt
d_model: 512
num_heads: 4            # d_k = 128
d_ff: 1024
num_encoder_layers: 6
num_decoder_layers: 6
dropout: 0.3
attention_dropout: 0.0
activation_dropout: 0.0
norm_position: post
positional_encoding: sinusoidal
max_positions: 1024
tie_weights: true
scale_embedding: true
layer_norm_eps: 1.0e-5

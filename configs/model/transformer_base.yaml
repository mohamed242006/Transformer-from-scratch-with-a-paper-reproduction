# Paper "base" configuration (Table 3, row "base"): reference for parameter counts and
# exact-architecture checks. 63,082,496 parameters with V = 37,000 (paper reports 65M;
# see paper_notes.md §7.2 for the discrepancy).
name: transformer_base
d_model: 512
num_heads: 8            # d_k = 64
d_ff: 2048
num_encoder_layers: 6
num_decoder_layers: 6
dropout: 0.1
attention_dropout: 0.0
activation_dropout: 0.0
norm_position: post
positional_encoding: sinusoidal
max_positions: 1024
tie_weights: true
scale_embedding: true
layer_norm_eps: 1.0e-5

# Small model for the synthetic copy task (Week 5 exit criterion: ~100% accuracy).
name: transformer_copy
d_model: 128
num_heads: 4
d_ff: 256
num_encoder_layers: 2
num_decoder_layers: 2
dropout: 0.1
attention_dropout: 0.0
activation_dropout: 0.0
norm_position: post
positional_encoding: sinusoidal
max_positions: 128        # copy max_len 24 + 1 + 50 decoding margin = 75
tie_weights: true
scale_embedding: true
layer_norm_eps: 1.0e-5

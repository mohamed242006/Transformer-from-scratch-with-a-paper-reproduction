# Week 9 Phase 1 pilot (ADR-023 §8): 6,000 updates; same data, decoding and clipping rules as Phase 2.
# RNNs: clip_norm 1.0, the one declared difference (ADR-021).
name: iwslt14_pilot_gru_bahdanau
data: iwslt14
model: gru_bahdanau_iwslt
train: iwslt_pilot
overrides:
  - train.clip_norm=1.0
  # Memory-equivalent batching (ADR-023 §8): the worst-case 8,192-token batch does not
  # fit a T4 (additive attention keeps a [B, T, S, 1104] tensor; Kaggle validation:
  # CUDA OOM). Two 4,096-token micro-batches per update give the same effective update
  # size, the same per-update token normalization and the same LR schedule.
  - data.batching.max_tokens=4096
  - train.update_freq=2

# Week 9 Phase 1 pilot (ADR-023 §8): the iwslt_t4 recipe cut to 6,000 updates. Long
# enough to pass the full 4,000-update warmup of the 6+6 Post-LN Transformer (the
# Week 8 layers6 failure) and rank learning rates; not a result in itself.
name: iwslt_pilot
seed: 1
max_updates: 6000
update_freq: 1
label_smoothing: 0.1
amp: auto
schedule: {kind: inverse_sqrt, warmup_steps: 4000, peak_lr: 7.0e-4}
log_every: 100
validate_every: 1000
save_every: 1000
average_last: 3          # last 3,000 updates; the pilot uses the best checkpoint anyway
time_budget_minutes: 690
loggers: [stdout, jsonl]
